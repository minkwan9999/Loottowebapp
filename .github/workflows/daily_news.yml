name: Daily Lotto News Bot

on:
  schedule:
    # 한국 시간 기준 매일 오전 7시 자동 실행 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 테스트용 수동 실행 버튼 활성화

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 패키지 설치
        run: pip install requests supabase

      - name: 뉴스 수집 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python crawler.py
